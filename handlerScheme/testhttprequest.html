<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>HTTP 編碼測試</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

    <h2>Android 瀏覽器 HTTP 測試</h2>
    <button id="sendBtn">發送 POST JSON 請求</button>

    <h3>回應狀態：</h3>
    <div id="status">等待發送...</div>

    <h3>回傳的原始文字 (Result)：</h3>
    <pre id="output">尚未收到資料</pre>

    <script>
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const output = document.getElementById('output');
            const statusDiv = document.getElementById('status');
            
            statusDiv.innerText = "發送中...";
            output.innerText = "";

            // ⚠️ 請在此處替換成你實際測試的 API URL
            const apiUrl = 'https://mcloud.mmh.org.tw/DMZPHYCS1079/api/obsNbbrndata'; 

            // ⚠️ 請在此處填入你原本發送的 JSON 參數（即使沒有中文也請依樣畫葫蘆放進去）
            const requestData = {
                 "HOSPID": "1",
                 "PNO": "39867523"
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=utf-8',
                        // 如果有需要特定的 Token 或 Header，請加在這裡：
                        // 'Authorization': 'Bearer xxxxxx'
                    },
                    body: JSON.stringify(requestData)
                });

                statusDiv.innerText = `成功！HTTP 狀態碼: ${response.status}`;
                
                // 讀取原始文字回應，不經過 JSON 解析，直接看字串
                const textResult = await response.text();
                output.innerText = textResult;

            } catch (error) {
                statusDiv.innerText = "發送失敗，請檢查 Console 控制台。";
                output.innerText = error.toString();
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
