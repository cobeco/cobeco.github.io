<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>HTTP CORS POST 測試</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

    <h2>Android 瀏覽器 HTTP 測試 (CORS Proxy POST 版)</h2>
    <button id="sendBtn">發送 POST JSON 請求</button>

    <h3>回應狀態：</h3>
    <div id="status">等待發送...</div>

    <h3>回傳的原始文字 (Result)：</h3>
    <pre id="output">尚未收到資料</pre>

    <script>
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const output = document.getElementById('output');
            const statusDiv = document.getElementById('status');
            
            statusDiv.innerText = "發送中 (POST 請求轉發中)...";
            output.innerText = "";

            // 1. ⚠️ 設定你原本的後端 API 網址
            const targetUrl = 'https://mcloud.mmh.org.tw/DMZPHYCS1079/api/obsNbbrndata'; 

            // 2. 使用 corsproxy.io 代理網址
            const apiUrl = 'https://corsproxy.io?' + encodeURIComponent(targetUrl);

            // 3. ⚠️ 填入你 Android App 裡對應發送的 JSON 參數
            const requestData = {
        "HOSPID": "1",
                 "PNO": "39867523"
    };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=utf-8'
                    },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP 錯誤! 狀態碼: ${response.status}`);
                }

                statusDiv.innerText = "成功收到回傳！";
                
                // 直接讀取原始文字回应
                const textResult = await response.text();
                output.innerText = textResult;

            } catch (error) {
                statusDiv.innerText = "發送失敗";
                output.innerText = error.toString();
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
